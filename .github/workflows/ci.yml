name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: Swift
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Self-test (offline DSP checks, no audio hardware needed)
        run: |
          "$(swift build -c release --show-bin-path)/inline-dsp" --self-test
